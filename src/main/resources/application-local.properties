# ==========================================
# LOCAL DEVELOPMENT PROFILE
# ==========================================

# =========================
# DATABASE - DEDICATED FOR ADMIN SERVICE
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/adminServiceDb
spring.datasource.username=root
spring.datasource.password=

# =========================
# SERVER
# =========================
server.port=8082

# =========================
# EUREKA - ENABLED (Gateway använder lb://)
# =========================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# SERVICE URLS - DIRECT HTTP
# =========================
user-service.base-url=http://localhost:8081
payment-service.base-url=http://localhost:8083

# =========================
# JPA - SHOW SQL
# =========================
spring.jpa.properties.hibernate.format_sql=true
