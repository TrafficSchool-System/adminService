# ==========================================
# LOCAL DEVELOPMENT PROFILE
# ==========================================

# =========================
# DATABASE - DEDICATED FOR ADMIN SERVICE
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/adminServiceDb
spring.datasource.username=root
spring.datasource.password=

# =========================
# SERVER
# =========================
server.port=8082

# =========================
# EUREKA - ENABLED (Gateway använder lb://)
# =========================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# INTERNAL SERVICE API KEY
# =========================
service.api.key=TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD

# =========================
# SERVICE URLS - DIRECT HTTP
# =========================
user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}
payment-service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8083}
quiz-service.base-url=${QUIZ_SERVICE_BASE_URL:http://localhost:8085}
exam-service.base-url=${EXAM_SERVICE_BASE_URL:http://localhost:8084}

# =========================
# JPA - SHOW SQL
# =========================
spring.jpa.properties.hibernate.format_sql=true
