# Railway-specific configuration for adminService

# Eureka Instance Configuration
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:adminservice-production-72f0.up.railway.app}
eureka.instance.non-secure-port=${EUREKA_INSTANCE_NON_SECURE_PORT:8082}
