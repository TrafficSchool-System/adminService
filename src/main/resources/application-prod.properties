# ==========================================
# PRODUCTION PROFILE (Railway/Docker/Kubernetes)
# ==========================================

# =========================
# DATABASE - DEDICATED FOR ADMIN SERVICE
# =========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:mysql-admin}:${MYSQLPORT:3306}/${MYSQLDATABASE:adminServiceDb}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}

# =========================
# SERVER
# =========================
server.port=${PORT:8082}

# =========================
# EUREKA - ENABLED
# =========================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${SERVICE_NAME:admin-service}
eureka.instance.non-secure-port=8082
eureka.instance.instance-id=${eureka.instance.hostname}:${server.port}

# =========================
# SERVICE URLS - EUREKA
# =========================
user-service.base-url=${USER_SERVICE_BASE_URL:http://user-service}
payment-service.base-url=${PAYMENT_SERVICE_BASE_URL:http://payment-service}
quiz-service.base-url=${QUIZ_SERVICE_BASE_URL:http://quiz-service}
exam-service.base-url=${EXAM_SERVICE_BASE_URL:http://exam-service}

# =========================
# LOGGING - INFO
# =========================
logging.level.com.example.adminService=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# =========================
# JPA - HIDE SQL
# =========================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
