# Server Configuration
spring.application.name=admin-service
server.port=${SERVER_PORT:8084}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adminServiceDb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT Configuration - REFACTORED
# AdminService läser INTE JWT tokens från användare längre!
# Gateway validerar JWT och sätter X-User-Id, X-User-Email, X-User-Role headers
# AdminService läser dessa headers via GatewayHeaderAuthenticationFilter

# Men AdminService genererar EGNA JWT tokens för admin-login
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Service-to-Service API Key
# VIKTIGT: Denna nyckel används när AdminService kommunicerar med UserService
# Måste vara samma som i UserService! Ändra i produktion med miljövariabel SERVICE_API_KEY
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}

# Microservices URLs Configuration
# Kan använda antingen service names (med Eureka) eller direkta URLs
services.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
services.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}

#Log
spring.output.ansi.enabled=ALWAYS
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE