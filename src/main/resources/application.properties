# ==========================================
# SHARED CONFIGURATION (ALL ENVIRONMENTS)
# ==========================================
# Profile-specific overrides:
# - application-local.properties
# - application-prod.properties

# =========================
# APPLICATION
# =========================
spring.application.name=admin-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =========================
# DATABASE - SHARED CONFIG
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=AdminServiceHikariPool

# =========================
# JPA/HIBERNATE - SHARED CONFIG
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Timezone - UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# =========================
# JWT CONFIGURATION
# =========================
# AdminService generates JWT tokens for admin login
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================
# SERVICE-TO-SERVICE API KEY
# =========================
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}

# =========================
# MICROSERVICES URLS (for WebClient)
# =========================
# Used when Eureka is disabled (Railway)
services.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
services.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8083}

# =========================
# LOGGING
# =========================
spring.output.ansi.enabled=ALWAYS
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.adminService=DEBUG

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always